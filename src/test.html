<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3> testing Controller + storage + model</h3>
    <script type="module">
        import { FinanceController } from './controller/financeContoller.js';

        const controller = new FinanceController();

        (async () => {
            // 1. Init from IndexedDB
            await controller.init();

            // 2. Add a new transaction
            const t = await controller.addTransaction({
                group: 'Household',
                category: 'Groceries',
                amount: '42.50', // string or number, model will Number() it
                date: '2025-11-17',
            });
            console.log('Saved:', t);

            // 3. Get all 
            console.log("All transactions:", controller.getAllTransactions());
        })();

    </script>
</body>
</html>
