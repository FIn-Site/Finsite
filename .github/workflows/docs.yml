name: Generate and Deploy API Documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.js'
      - 'docs/JSDOC_STYLE_GUIDE.md'
      - '.github/workflows/docs.yml'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Generate API documentation
        run: npm run docs:generate
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/api
          destination_dir: api
          keep_files: false
          
      - name: Create documentation summary
        run: |
          echo "## 📚 API Documentation Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "API documentation has been generated and deployed to GitHub Pages." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **View Documentation:** https://fin-site.github.io/Finsite/api/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated from commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
